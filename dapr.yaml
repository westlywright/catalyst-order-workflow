version: 1
common:
  logLevel: error
  appLogDestination: "console"
  daprdLogDestination: "console"
  resourcesPaths: ["./resources"]
apps:
  - appID: inventory
    appPort: 3002
    appDirPath: ./services/inventory
    command: ["python3", "app.py"]
  - appID: order-processor
    appDirPath: ./services/order-processor
    command: ["python3", "app.py"]
  - appID: payments
    appPort: 3003
    appDirPath: ./services/payments
    command: ["python3", "app.py"]
  - appID: notifications
    appPort: 8080
    appDirPath: ./services/notifications
    command: ["npm", "run", "dev"]
  - appID: shipping
    appPort: 3004
    appDirPath: ./services/shipping
    command: ["python3", "app.py"]
  - appID: batch-processor
    appPort: 3007
    appDirPath: ./services/batch-processor
    command: ["python3", "app.py"]
  - appID: returns
    appPort: 3008
    appDirPath: ./services/returns
    command: ["python3", "app.py"]
  - appID: chaos-engineer
    appPort: 3010
    appDirPath: ./services/chaos-engineer
    command: ["python3", "app.py"]
